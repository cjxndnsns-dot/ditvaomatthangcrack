<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>ditvaomatthangcrack</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(145deg, #0b0f1a 0%, #1a1f2e 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
      padding: 16px;
    }

    .card {
      max-width: 650px;
      width: 100%;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      border-radius: 42px;
      padding: 28px 24px 36px;
      box-shadow: 0 30px 50px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.08);
      transition: transform 0.3s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .card:hover {
      transform: scale(1.01);
    }

    .image-wrapper {
      width: 100%;
      border-radius: 28px;
      overflow: hidden;
      box-shadow: 0 20px 30px -8px black;
      background: #0c0e14;
      margin-bottom: 28px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      aspect-ratio: 1 / 1; /* vuông vức, nhưng ảnh sẽ tự co giãn */
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .image-wrapper img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain; /* giữ nguyên tỷ lệ ảnh, không crop */
      background: #0c0e14;
      transition: opacity 0.4s ease;
    }

    .admin-info {
      font-size: clamp(1.3rem, 6vw, 2rem);
      font-weight: 700;
      letter-spacing: 1.5px;
      color: #ffffff;
      background: linear-gradient(135deg, #ffe6b0, #ffc978);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 20px rgba(255, 200, 80, 0.5);
      padding: 12px 24px;
      border-radius: 60px;
      background-color: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(12px);
      display: inline-block;
      border: 1px solid rgba(255, 215, 120, 0.5);
      box-shadow: 0 10px 25px -5px #00000080, 0 0 15px rgba(255, 190, 60, 0.3);
      margin-top: 8px;
      width: fit-content;
      max-width: 100%;
      word-break: break-word;
      transition: all 0.2s;
    }

    .admin-info span {
      background: none;
      -webkit-text-fill-color: #fff3d1;
      text-shadow: 0 0 12px #ffbb33;
    }

    /* fallback nếu ảnh lỗi */
    .image-wrapper img.error {
      opacity: 0.6;
    }

    @media (max-width: 480px) {
      .card {
        padding: 18px 14px 28px;
        border-radius: 32px;
      }

      .image-wrapper {
        border-radius: 22px;
        margin-bottom: 20px;
      }

      .admin-info {
        font-size: 1.2rem;
        padding: 10px 18px;
      }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="image-wrapper">
      <img 
        src="https://i.postimg.cc/nzRYzSPQ/26011bd758837f2ac0773b92f9c5771a.jpg" 
        alt="Admin Zalo"
        loading="eager"
        onerror="this.classList.add('error'); this.alt='Không tải được ảnh';"
      >
    </div>
    <div class="admin-info">
      ADMIN ZALO: <span>0976457016</span>
    </div>
  </div>
</body>
</html>
